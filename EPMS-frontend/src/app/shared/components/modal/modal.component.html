@if (visible) {
  <div class="modal-backdrop">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title">{{ title }}</span>
        <p-button
          icon="pi pi-times"
          [text]="true"
          [rounded]="true"
          severity="secondary"
          (onClick)="close()"
          ariaLabel="Close"
        />
      </div>
      <div class="modal-body">
        <ng-content />
      </div>
    </div>
  </div>
}
