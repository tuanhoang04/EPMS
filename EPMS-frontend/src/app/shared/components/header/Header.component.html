<header class="app-header">
  <div class="header-container main-layout-container">
    <!-- Left: Page Title -->
    <span class="header-title" (click)="onHome()" style="cursor: pointer">{{ pageTitle }}</span>

    <!-- Right: Profile Icon + Overlay Menu -->
    <div class="header-actions">
      <p-button
        icon="pi pi-user"
        [rounded]="true"
        [text]="true"
        [plain]="true"
        severity="secondary"
        (click)="profileMenu.toggle($event)"
        ariaLabel="User profile menu"
        styleClass="profile-btn"
      />

      <p-menu
        #profileMenu
        [model]="profileMenuItems"
        [popup]="true"
        appendTo="body"
        styleClass="profile-dropdown"
      />
    </div>
  </div>
</header>

<app-auth-modal
  [visible]="authModalVisible()"
  [mode]="authModalMode()"
  (visibleChange)="authModalVisible.set($event)"
/>

<app-modal
  [visible]="profileModalVisible()"
  (closed)="profileModalVisible.set(false)"
  title="User Profile"
  size="large"
  [closeOnBackdrop]="true"
>
  <app-profile (close)="profileModalVisible.set(false)" />
</app-modal>
