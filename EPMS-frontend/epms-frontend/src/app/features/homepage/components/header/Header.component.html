<header class="app-header">
  <!-- Left: Page Title -->
  <span class="header-title">{{ pageTitle }}</span>

  <!-- Right: Profile Icon + Overlay Menu -->
  <div class="header-actions">
    <p-button
      icon="pi pi-user"
      [rounded]="true"
      [text]="true"
      [plain]="true"
      severity="secondary"
      (click)="profileMenu.toggle($event)"
      ariaLabel="User profile menu"
      styleClass="profile-btn"
    />

    <p-menu
      #profileMenu
      [model]="profileMenuItems"
      [popup]="true"
      styleClass="profile-dropdown"
    />
  </div>
</header>
