<app-header [pageTitle]="'EPMS homepage'"></app-header>

<div class="homepage-container">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="left"></div>

    <div class="right">
      <button pButton icon="pi pi-list" class="p-button-text"></button>
      <button pButton icon="pi pi-plus" class="p-button-rounded"></button>
    </div>
  </div>

  <!-- Cards grid -->
  <div class="card-grid">
    <div class="card" *ngFor="let item of subjects">

      <img [src]="item.image" alt="thumbnail" />

      <div class="card-content">
        <h3>{{ item.title }}</h3>
        <p>{{ item.questions }} Questions - {{ item.topics }} Topics</p>
        <small>{{ item.description }}</small>
      </div>

      <button pButton icon="pi pi-ellipsis-h" class="menu-btn p-button-text"></button>

    </div>
  </div>

</div>

<!-- Bottom navigation -->
<div class="bottom-nav">
  <div class="nav-item active">
    <i class="pi pi-home"></i>
    <span>Homepage</span>
  </div>
  <div class="nav-item">
    <i class="pi pi-list"></i>
    <span>Question</span>
  </div>
  <div class="nav-item">
    <i class="pi pi-table"></i>
    <span>Template</span>
  </div>
  <div class="nav-item">
    <i class="pi pi-history"></i>
    <span>Exam history</span>
  </div>
</div>
